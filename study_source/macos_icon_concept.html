<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>macOS Icon Concept (SVG)</title>
    <style>
        body { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; background-color: #f0f0f0; }
        svg { width: 256px; height: 256px; /* Display size for preview */ margin-bottom: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

<svg id="icon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Approximate macOS squircle background - Made smaller -->
  <!-- Using a standard rounded rect as approximation. True squircle requires complex path -->
  <rect x="15" y="15" width="70" height="70" rx="18" ry="18" fill="url(#grad1)"/>

  <!-- Centered Text element (3n+1) -->
  <text x="50" y="50"
        font-family="monospace"
        font-size="20"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        dominant-baseline="middle">
    3n+1
  </text>

</svg>

<button id="download-btn" style="margin-top: 20px; padding: 10px 20px; font-size: 16px; cursor: pointer;">Download SVG</button>

<script>
  document.getElementById('download-btn').addEventListener('click', function() {
    const svgElement = document.getElementById('icon-svg');
    const svgData = new XMLSerializer().serializeToString(svgElement);
    
    const blob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    
    const link = document.createElement('a');
    link.href = url;
    link.download = 'collatz_icon.svg'; // Filename for download
    document.body.appendChild(link); // Required for Firefox
    link.click();
    document.body.removeChild(link);
    
    URL.revokeObjectURL(url); // Clean up
  });
</script>

</body>
</html>
