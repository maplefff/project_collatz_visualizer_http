<svg id="icon-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#9b59b6;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Approximate macOS squircle background -->
  <!-- Using a standard rounded rect as approximation. True squircle requires complex path -->
  <rect x="5" y="5" width="90" height="90" rx="22" ry="22" fill="url(#grad1)"/>

  <!-- Centered Text element (3n+1) -->
  <text x="50" y="50" font-family="monospace" font-size="27" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">
    3n+1
  </text>

</svg>