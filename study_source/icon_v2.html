<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collatz Icon Concepts V2</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background-color: #f0f0f0; }
        .container { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px; }
        .icon-card { background-color: white; border-radius: 8px; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .icon-display { width: 100px; height: 100px; margin: 10px auto; border: 1px solid #ccc; display: flex; justify-content: center; align-items: center; font-size: 40px; position: relative; overflow: hidden; background-color: #e8e8e8; }
        .icon-card h3 { margin-top: 0; font-size: 1em; }

        /* --- Icon Styles V2 --- */

        /* 1. Combined Style (3n+1 Text + Gradient BG) */
        .icon-v2-1 {
            font-family: monospace;
            color: white;
            display: flex;
            flex-direction: column;
            font-size: 28px; /* Adjusted size */
            line-height: 1.1;
            font-weight: bold;
            background: linear-gradient(45deg, #3498db, #9b59b6);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        /* 2. Simple Line Graph */
        .icon-v2-2 svg {
            width: 80%; height: 80%;
        }
        .icon-v2-2 polyline {
            fill: none; stroke: #e74c3c; stroke-width: 4;
            stroke-linecap: round; stroke-linejoin: round;
        }

        /* 3. Sequence Example */
        .icon-v2-3 {
            font-size: 18px;
            font-weight: bold;
            color: #2c3e50;
            line-height: 1.3;
            font-family: 'Courier New', Courier, monospace;
        }

        /* 4. Gear / Processing */
        .icon-v2-4 {
             color: #f39c12; font-size: 60px;
             animation: spin 4s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 5. Hailstone */
        .icon-v2-5 {
            width: 30px; height: 30px;
            background-color: #add8e6;
            border-radius: 50% 50% 50% 0;
            transform: rotate(45deg);
            border: 3px solid #87ceeb;
        }

        /* 6. Network Node */
        .icon-v2-6 svg {
             width: 70%; height: 70%;
        }
        .icon-v2-6 circle {
            fill: #1abc9c;
        }
         .icon-v2-6 line {
             stroke: #bdc3c7; stroke-width: 3;
         }

        /* 7. Simple "C" */
        .icon-v2-7 {
            font-family: 'Georgia', serif;
            font-weight: bold;
            font-size: 60px;
            color: #8e44ad;
        }

        /* 8. Minimalist Path */
        .icon-v2-8 svg {
             width: 70%; height: 70%;
        }
        .icon-v2-8 path {
             fill: none; stroke: #34495e; stroke-width: 6;
             stroke-linecap: round;
             marker-end: url(#arrowhead);
        }

        /* 9. Pulse / Waveform */
        .icon-v2-9 svg {
            width: 90%; height: 50%;
        }
        .icon-v2-9 path {
             fill: none; stroke: #27ae60; stroke-width: 5;
             stroke-linecap: round;
        }

        /* 10. Magnifying Glass */
        .icon-v2-10 {
             font-size: 60px;
             color: #7f8c8d;
        }

    </style>
</head>
<body>
    <h1>Collatz Visualizer - Icon Concepts V2</h1>
    <p>Featuring a combination of "3n+1" text and gradient background.</p>
    <div class="container">
        <!-- Icon 1: Combined -->
        <div class="icon-card">
            <h3>1. Gradient Formula</h3>
            <div class="icon-display icon-v2-1"><span>3n</span><span>+1</span></div>
        </div>

        <!-- Icon 2: Line Graph -->
        <div class="icon-card">
            <h3>2. Line Graph</h3>
            <div class="icon-display icon-v2-2">
                 <svg viewBox="0 0 100 100">
                    <polyline points="10,80 30,30 50,90 70,10 90,50"/>
                </svg>
            </div>
        </div>

        <!-- Icon 3: Sequence -->
        <div class="icon-card">
            <h3>3. Sequence</h3>
            <div class="icon-display icon-v2-3">
                6→3→10→5...
            </div>
        </div>

        <!-- Icon 4: Gear -->
        <div class="icon-card">
            <h3>4. Processing</h3>
            <div class="icon-display icon-v2-4">⚙️</div>
        </div>

        <!-- Icon 5: Hailstone -->
        <div class="icon-card">
            <h3>5. Hailstone</h3>
            <div class="icon-display icon-v2-5"></div>
        </div>

        <!-- Icon 6: Network -->
        <div class="icon-card">
            <h3>6. Network</h3>
            <div class="icon-display icon-v2-6">
                 <svg viewBox="0 0 100 100">
                     <line x1="30" y1="70" x2="50" y2="30" />
                     <line x1="70" y1="70" x2="50" y2="30" />
                    <circle cx="30" cy="70" r="15"/>
                    <circle cx="70" cy="70" r="15"/>
                     <circle cx="50" cy="30" r="15"/>
                </svg>
            </div>
        </div>

        <!-- Icon 7: Simple C -->
        <div class="icon-card">
            <h3>7. Collatz "C"</h3>
            <div class="icon-display icon-v2-7">C</div>
        </div>

        <!-- Icon 8: Path -->
        <div class="icon-card">
            <h3>8. Path</h3>
            <div class="icon-display icon-v2-8">
                 <svg viewBox="0 0 100 100">
                     <defs>
                        <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
                        <polygon points="0 0, 10 3.5, 0 7" fill="#34495e" />
                        </marker>
                    </defs>
                     <path d="M10,50 C40,10 60,90 90,50" />
                </svg>
            </div>
        </div>

        <!-- Icon 9: Waveform -->
        <div class="icon-card">
            <h3>9. Waveform</h3>
            <div class="icon-display icon-v2-9">
                 <svg viewBox="0 0 100 50">
                     <path d="M0,25 Q12.5,0 25,25 T50,25 T75,25 T100,25" />
                </svg>
            </div>
        </div>

        <!-- Icon 10: Magnifying Glass -->
        <div class="icon-card">
            <h3>10. Explore</h3>
            <div class="icon-display icon-v2-10">🔍</div>
        </div>

    </div>
</body>
</html>
